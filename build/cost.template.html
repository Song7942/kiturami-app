<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원가관리</title>
<style>
:root{--bg:#fff;--surface:#f8fafc;--surface2:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#0ea5e9;--accent2:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--surface:#1e293b;--surface2:#263447;--border:#334155;--text:#e2e8f0;--muted:#94a3b8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:13px}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px}
h1{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
h1 small{font-weight:400;font-size:11px;color:var(--muted)}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
button{padding:6px 11px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer;font-size:12px}
button.pri{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:700}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=search]{padding:5px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:12px}
.sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.tag{font-size:11px;color:var(--muted)}
.wrap{padding:0 10px 60px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th{position:sticky;top:var(--hh,0px);background:var(--surface2);padding:6px 6px;text-align:center;white-space:nowrap;
   border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-size:11px;z-index:5}
td{padding:3px 6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:middle}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.code{font-family:'Courier New',monospace;font-size:10.5px;white-space:nowrap}
tr:nth-child(even) td{background:var(--surface)}
tr.isnew td:first-child{box-shadow:inset 3px 0 0 #16a34a}
tr.gone td{opacity:.55}
tr.gone td.code{color:#dc2626}
input.cell{width:100%;padding:2px 4px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--text);
           text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
input.cell:hover{border-color:var(--border)}
input.cell:focus{outline:none;border-color:var(--accent2);background:var(--bg)}
td.man input.cell{background:#ffedd5;color:#9a3412;font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
      padding:7px 14px;font-size:12px;display:flex;gap:14px;align-items:center}
.ok{color:#16a34a}.no{color:#dc2626}.busy{color:var(--accent2)}
.flag{font-size:10px;padding:0 4px;border-radius:4px;margin-left:4px;vertical-align:middle}
.flag.n{background:#dcfce7;color:#166534}
.flag.g{background:#fee2e2;color:#991b1b}
.flag.u{background:#dbeafe;color:#1e40af}
td.hc{position:relative}
.hdot{position:absolute;right:1px;top:1px;width:6px;height:6px;border-radius:50%;background:#ef4444;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>원가관리 <small id="made"></small></h1>
  <div class="bar">
    <input type="search" id="q" placeholder="품명·규격·품번으로 찾기…" style="width:230px">
    <label class="tag" style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="onlyNew">새·갱신·없어진 것만</label>
    <span class="sep"></span>
    <span class="tag">환율</span>
    <span class="tag">RUB</span><input type="text" id="rub" style="width:72px;text-align:right">
    <span class="tag">USD</span><input type="text" id="usd" style="width:78px;text-align:right">
    <button id="fx">환율 받아오기</button>
    <span class="tag" id="fxinfo"></span>
    <span class="sep"></span>
    <span class="tag">기준 GP</span><input type="text" id="gp" title="0 ~ 99.9 사이의 퍼센트로 적습니다 (예: 40)" style="width:52px;text-align:right"><span class="tag">%</span>
    <span class="sep"></span>
    <button id="sync">웹과 맞추기</button>
    <button id="save" title="고칠 때마다 저절로 담깁니다. 이 단추는 지금 바로 담고 알려 주기만 합니다.">저장</button>
    <button id="exp">파일로 내보내기</button>
    <button id="imp">파일에서 불러오기</button>
    <button id="imx">원가 엑셀 올리기</button>
    <button id="fclrAll" style="display:none">거르개 해제</button>
    <button id="vbtn">보기</button>
    <button id="hbtn">변경이력</button>
    <button id="xls">엑셀 내려받기</button>
    <span class="sep"></span>
    <button id="push" class="pri">웹에 공급가 보내기</button>
  </div>
</header>
<div class="wrap">
  <table id="t"><thead id="th"></thead><tbody id="tb"></tbody></table>
  <div id="empty" style="padding:30px;text-align:center;color:var(--muted);display:none">찾는 품목이 없습니다.</div>
</div>
<div class="foot">
  <span id="cnt"></span>
  <span id="saved" class="tag" style="color:#16a34a"></span>
  <span id="msg" class="tag"></span>
</div>
<input type="file" id="file" accept=".json" style="display:none">
<input type="file" id="xfile" accept=".xlsx,.xls" style="display:none">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ── 원가관리 — 내 컴퓨터에만 두는 자료 ──────────────────────
 *   원가 · 환율 · 기준 GP · 계산식은 이 파일에만 있습니다. 서버로 나가지 않습니다.
 *   [웹에 공급가 보내기] 를 누를 때에만 '품번 + 공급가 RUB' 가 웹으로 갑니다.
 *   품명·규격·대표품번·최종품번은 웹의 품번조회가 주인입니다 — 열 때마다
 *   [웹과 맞추기] 가 저절로 한 번 돌아 웹에서 고친 것을 끌어옵니다.
 *   고친 것은 [저장] 을 눌러 이 브라우저에 담아 둡니다.
 *   컴퓨터를 바꾸거나 백업하려면 [파일로 내보내기] 로 .json 을 받아 두세요.
 */
const SEED = /*__SEED__*/null;
const PN_BASE = /*__PNBASE__*/null;      /* 품번조회 바탕 자료(웹과 같은 것) */
const SB_URL='__SB_URL__', SB_KEY='__SB_KEY__';
/* 자체 서버(kituramiparts.com)에도 같이 보낸다. 비어 있으면 안 보낸다. */
const HOST_URL='__HOST_URL__', HOST_KEY='__HOST_KEY__';
const SUP_CFG_ID = 105;                 /* 웹이 보는 공급가 자리 (kt_psi_cfg) */
const PN_TOMBSTONE = '__DELETED__';     /* 품번조회에서 지운 품목 표시 */
const FX_URL = 'https://kiturami-service.pages.dev/api/fxrate';
const LS_KEY = 'kt_cost_v1';

let D = null;                            /* {rows, rub, usd, gp, month, made} */
let view = [];
let _sb = null;
function sbc(){ if(!_sb) _sb = supabase.createClient(SB_URL, SB_KEY); return _sb; }

const $ = id => document.getElementById(id);
/* 빈 칸은 0 이 아니라 '없음' 이다 — 원가도 공급가도 없는 품목이 0원으로 둔갑하면 안 된다 */
const num = v => { const s=String(v==null?'':v).replace(/[, ]/g,'').trim();
                   if(s==='') return null; const n=Number(s); return isFinite(n)?n:null; };
const fmt = (v,d) => (v==null||v==='')?'' : Number(v).toLocaleString(undefined,{maximumFractionDigits:(d==null?1:d)});
const msg = (s,cls) => { const e=$('msg'); e.textContent=s||''; e.className='tag '+(cls||''); };
/* 웹의 normPN 과 같은 규칙 — 이 열쇠로 공급가도 보내고 품목도 맞춘다 */
const norm = x => String(x==null?'':x).toUpperCase().replace(/\s+/g,'');

function load(){
  let saved=null;
  try{ const s=localStorage.getItem(LS_KEY); if(s) saved=JSON.parse(s); }catch(e){}
  D = saved || JSON.parse(JSON.stringify(SEED));
  if(!D.rows) D.rows=[];
}
// 고칠 때마다 저절로 담깁니다 — [저장] 은 지금 바로 담고 알려 주기만 합니다.
function save(quiet){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(D));
    const t=new Date().toLocaleTimeString();
    const s=$('saved'); if(s) s.textContent='저장됨 '+t;
    if(!quiet) msg('저장했습니다 ('+t+')','ok');
  }
  catch(e){
    const s=$('saved'); if(s) s.textContent='저장 안 됨';
    msg('저장 실패 — 파일로 내보내기를 쓰세요: '+e.message,'no');
  }
}

/* 공급가 RUB = 공급가KRW ÷ 환율RUB.  공급가KRW 를 안 적었으면 원가와 기준 GP 로 셈한다. */
function supKrw(r){
  const s = num(r.sup);
  if(s!=null) return s;
  const c = num(r.cost);
  const gp = num(D.gp);
  if(c==null || gp==null || gp>=1) return null;
  return c/(1-gp);
}
function supRub(r){
  const k = supKrw(r), rub = num(D.rub);
  if(k==null || !rub) return null;
  return Math.round((k/rub)*10)/10;
}
function gpOf(r){
  const c=num(r.cost), k=supKrw(r);
  if(c==null || k==null || !k) return null;
  return (k-c)/k;
}

const COLS = [
  {k:'nm',  t:'품명',        w:210},
  {k:'sp',  t:'규격',        w:200},
  {k:'rep', t:'대표품번',    w:104},
  {k:'cmp', t:'호환품번',    w:104},
  {k:'fin', t:'최종품번',    w:104},
  {k:'cost',t:'원가 KRW',    w:86},
  {k:'cRub',t:'원가 RUB',    w:76},
  {k:'cUsd',t:'원가 USD',    w:76},
  {k:'sup', t:'공급가 KRW',  w:92},
  {k:'sRub',t:'공급가 RUB',  w:86},
  {k:'gp',  t:'GP',          w:58}
];

/* ══ 변경이력 ══════════════════════════════════════════════
 *   웹과 같은 방식으로 담습니다 — '어디서 고쳤나' 마다 한 줄,
 *   처음 고치기 전 값에서 마지막 값으로. 여러 번 고쳐도 줄이 늘지 않습니다.
 *   원래 값으로 되돌려 놓으면 그 줄은 지워집니다.
 *     D.hist = { '<열키>|<품번>': [ {b:전, a:후, t:시각, u:출처} ] }
 */
const HIST_MAX=600;                       // 담아 둘 칸 수(넘으면 오래된 것부터 버린다)
function hKey(f, pn){ return String(f)+'|'+String(pn||''); }
function hStore(){ if(!D.hist || typeof D.hist!=='object') D.hist={}; return D.hist; }
function hPnOf(r){ return norm(r.cmp) || norm(r.fin) || norm(r.rep); }
function hNum(v){ return String(v==null?'':v).replace(/[,\s]/g,'').trim(); }
function hAdd(f, pn, before, after, who){
  const b=hNum(before), a=hNum(after);
  if(b===a) return;
  const H=hStore(), k=hKey(f,pn);
  const arr=Array.isArray(H[k])?H[k]:(H[k]=[]);
  const u=String(who||'손으로');
  const i=arr.findIndex(h=>String(h.u||'')===u);
  const now=new Date().toISOString();
  if(i<0) arr.push({ b, a, t:now, u });
  else { arr[i].a=a; arr[i].t=now; if(arr[i].b===a) arr.splice(i,1); }
  if(!arr.length) delete H[k];
  // 너무 불어나면 가장 오래 손대지 않은 칸부터 버린다
  const keys=Object.keys(H);
  if(keys.length>HIST_MAX){
    keys.map(x=>({x, t:(H[x][H[x].length-1]||{}).t||''}))
        .sort((p,q)=>String(p.t).localeCompare(String(q.t)))
        .slice(0, keys.length-HIST_MAX)
        .forEach(o=>{ delete H[o.x]; });
  }
}
function hOf(f, pn){ const a=hStore()[hKey(f,pn)]; return Array.isArray(a)&&a.length?a:null; }
function hCount(){ let n=0; const H=hStore(); Object.keys(H).forEach(k=>{ n+=(H[k]||[]).length; }); return n; }
function hTime(t){
  try{ const d=new Date(t), p=x=>(x<10?'0':'')+x;
    return String(d.getFullYear()).slice(2)+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){ return ''; }
}
function hFmt(v){ const s=String(v==null?'':v); if(s==='') return '(빈칸)';
  const n=Number(s); return isFinite(n)?n.toLocaleString():s; }
const H_LABEL={ cost:'원가 KRW', sup:'공급가 KRW', '@gp':'기준 GP(%)', '@rub':'환율 RUB', '@usd':'환율 USD' };
function hLabel(f){ return H_LABEL[f]||f; }
// 칸 모서리에 붙이는 표시
function hDot(f, pn){
  return hOf(f,pn)
    ? '<span class="hdot" data-f="'+f+'" data-pn="'+esc(pn)+'" title="변경이력 보기"></span>'
    : '';
}
function hClose(){ const b=$('hPop'); if(b) b.remove();
  document.removeEventListener('mousedown', _hOut); document.removeEventListener('keydown', _hEsc); }
function _hOut(e){ const b=$('hPop'); if(b && !b.contains(e.target)) hClose(); }
function _hEsc(e){ if(e.key==='Escape') hClose(); }
function hRowsHtml(arr){
  return arr.slice().sort((x,y)=>String(y.t||'').localeCompare(String(x.t||''))).map((h,i)=>
    '<div style="padding:4px 0'+(i?';border-top:1px solid var(--border)':'')+'">'
    + '<div style="display:flex;align-items:baseline;gap:6px">'
    +   '<span style="flex:none;font-weight:700;min-width:46px">'+esc(String(h.u||'(모름)'))+'</span>'
    +   '<span style="flex:none;color:var(--muted);text-decoration:line-through">'+esc(hFmt(h.b))+'</span>'
    +   '<span style="flex:none;color:var(--muted)">→</span>'
    +   '<span style="flex:none;font-weight:700;color:var(--accent2)">'+esc(hFmt(h.a))+'</span>'
    +   '<span style="flex:1;min-width:0;text-align:right;color:var(--muted);font-size:10px;white-space:nowrap">'+esc(hTime(h.t))+'</span>'
    + '</div></div>').join('');
}
// 칸 하나의 이력 쪽지
function hShow(f, pn, anchor){
  hClose();
  const arr=hOf(f,pn); if(!arr) return;
  const rect=anchor.getBoundingClientRect(), W=300;
  const box=document.createElement('div'); box.id='hPop';
  box.style.cssText='position:fixed;top:'+(rect.bottom+4)+'px;left:'+Math.max(6,Math.min(rect.left-120,innerWidth-W-6))+'px;'
    +'z-index:10000;width:'+W+'px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;'
    +'box-shadow:0 10px 30px #0006;font-size:12px;color:var(--text);padding:9px 11px';
  box.innerHTML='<div style="font-size:11px;color:var(--muted);margin-bottom:4px">'
    + esc(pn)+' · '+esc(hLabel(f))+'</div>'+hRowsHtml(arr);
  document.body.appendChild(box);
  setTimeout(()=>{ document.addEventListener('mousedown', _hOut); document.addEventListener('keydown', _hEsc); },0);
}
// 전체 이력 창
function openHistAll(){
  hClose();
  const H=hStore();
  const list=[];
  Object.keys(H).forEach(k=>{
    const i=k.indexOf('|'); const f=k.slice(0,i), pn=k.slice(i+1);
    (H[k]||[]).forEach(h=>list.push({ f, pn, h }));
  });
  list.sort((x,y)=>String(y.h.t||'').localeCompare(String(x.h.t||'')));
  const box=document.createElement('div'); box.id='hPop';
  box.style.cssText='position:fixed;inset:0;z-index:10000;background:#0008;display:flex;align-items:center;justify-content:center';
  const line=o=>'<div class="hitem" data-s="'+esc((o.pn+' '+hLabel(o.f)).toLowerCase())+'"'
    +' style="display:flex;align-items:baseline;gap:7px;padding:4px 2px;border-bottom:1px solid var(--border)">'
    +'<span style="flex:none;width:112px;font-family:\'Courier New\',monospace;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(o.pn||'—')+'</span>'
    +'<span style="flex:none;width:76px;font-size:11px;color:var(--muted)">'+esc(hLabel(o.f))+'</span>'
    +'<span style="flex:none;color:var(--muted);text-decoration:line-through">'+esc(hFmt(o.h.b))+'</span>'
    +'<span style="flex:none;color:var(--muted)">→</span>'
    +'<span style="flex:none;font-weight:700;color:var(--accent2)">'+esc(hFmt(o.h.a))+'</span>'
    +'<span style="flex:none;width:40px;font-size:10px;color:var(--muted)">'+esc(String(o.h.u||''))+'</span>'
    +'<span style="flex:1;min-width:0;text-align:right;font-size:10px;color:var(--muted);white-space:nowrap">'+esc(hTime(o.h.t))+'</span>'
    +'</div>';
  box.innerHTML='<div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;width:720px;max-width:94vw;'
    +'max-height:86vh;display:flex;flex-direction:column;box-shadow:0 16px 44px #000a;font-size:12px;color:var(--text)">'
    +'<div style="padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px">'
    +'변경이력 <span style="font-weight:400;font-size:11px;color:var(--muted)">모두 '+list.length.toLocaleString()+'건 · 새것부터</span></div>'
    +'<div style="padding:10px 14px 6px"><input id="hq" type="text" placeholder="품번·열 이름으로 찾기…" style="width:100%;box-sizing:border-box;padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:12px"></div>'
    +'<div id="hlist" style="flex:1;min-height:0;overflow:auto;padding:0 14px 10px">'
    + (list.length?list.map(line).join(''):'<div style="padding:26px;text-align:center;color:var(--muted)">아직 고친 것이 없습니다.</div>')
    +'</div>'
    +'<div style="display:flex;gap:7px;padding:11px 14px;border-top:1px solid var(--border)">'
    +'<button id="hClr" style="flex:none;padding:7px 12px;border:1px solid #ef4444;border-radius:7px;background:var(--bg);color:#ef4444;cursor:pointer;font-size:12px">이력 지우기</button>'
    +'<button id="hX" style="flex:1;padding:7px;border:none;border-radius:7px;background:var(--accent2);color:#fff;cursor:pointer;font-size:12px;font-weight:700">닫기</button>'
    +'</div></div>';
  document.body.appendChild(box);
  box.querySelector('#hq').oninput=function(){ const s=this.value.trim().toLowerCase();
    box.querySelectorAll('.hitem').forEach(x=>{ x.style.display=(!s||(x.getAttribute('data-s')||'').includes(s))?'':'none'; }); };
  box.querySelector('#hClr').onclick=()=>{
    if(!confirm('담아 둔 변경이력을 모두 지웁니다.\n(원가·공급가 값은 그대로 둡니다)\n\n계속할까요?')) return;
    D.hist={}; save(true); hClose(); render(); msg('변경이력을 지웠습니다','ok');
  };
  box.querySelector('#hX').onclick=hClose;
  box.onmousedown=e=>{ if(e.target===box) hClose(); };
}
/* ══ 머리글 거르개·정렬 ════════════════════════════════════
 *   엑셀처럼 머리글의 ▾ 를 눌러 오름·내림차순으로 세우거나 값을 골라 거릅니다.
 *   화면에 보이는 값 그대로를 기준으로 삼습니다(셈해서 나오는 칸도 그 값으로).
 */
let _fSort={ k:null, dir:'asc' };
let _fSel={};                      // {열키: [고른 값들]}
// 그 줄의 그 열 값(거르개·정렬이 쓰는 기준값). 화면에 찍히는 것과 같게 맞춘다.
function fVal(r, k){
  const rub=num(D.rub), usd=num(D.usd);
  const c=num(r.cost);
  switch(k){
    case 'nm': case 'sp': case 'rep': case 'cmp': case 'fin': return String(r[k]||'');
    case 'cost': return c;
    case 'cRub': return (c!=null&&rub)?Math.round(c/rub*10)/10:null;
    case 'cUsd': return (c!=null&&usd)?Math.round(c/usd*100)/100:null;
    case 'sup':  { const v=supKrw(r); return (v==null)?null:Math.round(v); }
    case 'sRub': return supRub(r);
    case 'gp':   { const g=gpOf(r); return (g==null)?null:Math.round(g*1000)/10; }
  }
  return '';
}
function fText(r, k){ const v=fVal(r,k); return (v==null||v==='')?'':String(v); }
function fIsNum(k){ return ['cost','cRub','cUsd','sup','sRub','gp'].indexOf(k)>=0; }
function closeFilter(){ const b=$('fPop'); if(b) b.remove();
  document.removeEventListener('mousedown', _fOut); document.removeEventListener('keydown', _fEsc); }
function _fOut(e){ const b=$('fPop'); if(b && !b.contains(e.target)) closeFilter(); }
function _fEsc(e){ if(e.key==='Escape') closeFilter(); }
function openFilter(k, anchor){
  closeFilter();
  const col=COLS.find(c=>c.k===k)||{t:k};
  const rect=anchor.getBoundingClientRect();
  const set=new Set(); D.rows.forEach(r=>set.add(fText(r,k)));
  const numeric=fIsNum(k);
  let vals=[...set].sort((a,b)=>{
    if(a==='') return 1; if(b==='') return -1;
    return numeric ? (Number(a)-Number(b)) : String(a).localeCompare(String(b),'ko');
  });
  const capped=vals.length>800; if(capped) vals=vals.slice(0,800);
  const cur=_fSel[k]?new Set(_fSel[k]):null;
  const W=250;
  const box=document.createElement('div'); box.id='fPop';
  box.style.cssText='position:fixed;top:'+(rect.bottom+4)+'px;left:'+Math.max(6,Math.min(rect.left,innerWidth-W-6))+'px;'
    +'z-index:9999;width:'+W+'px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;'
    +'box-shadow:0 10px 30px #0006;font-size:12px;color:var(--text);overflow:hidden';
  const sb=(dir,txt)=>'<button class="fsort" data-dir="'+dir+'" style="width:100%;text-align:left;padding:6px 8px;border:none;'
    +'background:'+((_fSort.k===k&&_fSort.dir===dir)?'var(--accent2)':'none')+';'
    +'color:'+((_fSort.k===k&&_fSort.dir===dir)?'#fff':'var(--text)')+';cursor:pointer;border-radius:6px;font-size:12px">'+txt+'</button>';
  box.innerHTML='<div style="padding:8px 8px 6px;border-bottom:1px solid var(--border)">'
    +'<div style="font-size:11px;color:var(--muted);margin:0 2px 5px">'+esc(col.t)+'</div>'
    +sb('asc','▲ 오름차순 정렬')+sb('desc','▼ 내림차순 정렬')+'</div>'
    +'<div style="padding:8px">'
    +'<input id="fq" type="text" placeholder="값 검색…" style="width:100%;box-sizing:border-box;padding:5px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:12px">'
    +'<label style="display:flex;align-items:center;gap:6px;padding:5px 4px 4px;cursor:pointer;font-weight:600;border-bottom:1px solid var(--border);margin-top:4px">'
    +'<input type="checkbox" id="fall" checked style="cursor:pointer;flex:none"><span>(모두 선택)</span></label>'
    +'<div id="flist" style="max-height:230px;overflow:auto;margin-top:2px">'
    + vals.map(v=>'<label class="fitem" data-v="'+esc(v)+'" style="display:flex;align-items:center;gap:6px;padding:3px 6px;cursor:pointer;line-height:1.3">'
       +'<input type="checkbox" class="fchk" '+((!cur||cur.has(v))?'checked':'')+' style="cursor:pointer;flex:none">'
       +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(v===''?'(비어 있음)':esc(v))+'</span></label>').join('')
    +'</div>'
    +(capped?'<div style="font-size:10.5px;color:var(--muted);margin-top:4px">값이 많아 앞 800개만 보여 줍니다 — 검색으로 찾으세요.</div>':'')
    +'</div>'
    +'<div style="display:flex;gap:6px;padding:8px;border-top:1px solid var(--border)">'
    +'<button id="fok" style="flex:1;padding:6px;border:none;border-radius:7px;background:var(--accent2);color:#fff;cursor:pointer;font-size:12px;font-weight:600">적용</button>'
    +'<button id="fclr" style="flex:1;padding:6px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer;font-size:12px">해제</button>'
    +'<button id="fx2" style="flex:none;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer;font-size:12px">✕</button>'
    +'</div>';
  document.body.appendChild(box);
  const items=()=>[...box.querySelectorAll('.fitem')];
  const visIt=()=>items().filter(x=>x.style.display!=='none');
  box.querySelectorAll('.fsort').forEach(b=>{ b.onclick=()=>{ _fSort={k, dir:b.getAttribute('data-dir')}; closeFilter(); render(); }; });
  box.querySelector('#fq').oninput=function(){ const s=this.value.trim().toLowerCase();
    items().forEach(x=>{ const v=x.getAttribute('data-v')||''; x.style.display=(!s||v.toLowerCase().includes(s))?'':'none'; }); };
  box.querySelector('#fall').onchange=function(){ visIt().forEach(x=>{ x.querySelector('.fchk').checked=this.checked; }); };
  box.querySelector('#fok').onclick=()=>{
    const picked=items().filter(x=>x.querySelector('.fchk').checked).map(x=>x.getAttribute('data-v')||'');
    if(picked.length===items().length && !capped) delete _fSel[k]; else _fSel[k]=picked;
    closeFilter(); render();
  };
  box.querySelector('#fclr').onclick=()=>{ delete _fSel[k]; if(_fSort.k===k) _fSort={k:null,dir:'asc'}; closeFilter(); render(); };
  box.querySelector('#fx2').onclick=closeFilter;
  setTimeout(()=>{ document.addEventListener('mousedown', _fOut); document.addEventListener('keydown', _fEsc); },0);
}
function filterReset(){ _fSel={}; _fSort={k:null,dir:'asc'}; closeFilter(); render(); }
function fChip(k){
  const on=(_fSel[k]!=null)||(_fSort.k===k);
  const g=(_fSort.k===k)?(_fSort.dir==='desc'?'▼':'▲'):'▾';
  return '<span class="fchip" data-k="'+k+'" title="거르개·정렬"'
    +' style="display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:14px;margin-left:3px;'
    +'border-radius:4px;border:1px solid '+(on?'var(--accent2)':'var(--border)')+';'
    +'background:'+(on?'var(--accent2)':'var(--bg)')+';color:'+(on?'#fff':'var(--muted)')+';'
    +'font-size:9px;line-height:1;cursor:pointer">'+g+'</span>';
}
function filtered(){
  const q=$('q').value.trim().toLowerCase();
  const onlyNew=$('onlyNew').checked;
  let a=D.rows;
  if(onlyNew) a=a.filter(r=>r.isNew||r.gone||r.costNew);
  if(q) a=a.filter(r=>[r.nm,r.sp,r.rep,r.cmp,r.fin].some(v=>String(v||'').toLowerCase().includes(q)));
  // 머리글에서 고른 값만 남긴다(여러 열을 걸면 모두 맞아야 한다)
  const fk=Object.keys(_fSel);
  if(fk.length){
    const sets={}; fk.forEach(k=>{ sets[k]=new Set(_fSel[k]); });
    a=a.filter(r=>fk.every(k=>sets[k].has(fText(r,k))));
  }
  // 머리글에서 고른 차례대로 세운다. 빈 칸은 늘 뒤로.
  if(_fSort.k){
    const k=_fSort.k, dir=(_fSort.dir==='desc')?-1:1, numeric=fIsNum(k);
    a=a.slice().sort((x,y)=>{
      const vx=fVal(x,k), vy=fVal(y,k);
      const ex=(vx==null||vx===''), ey=(vy==null||vy==='');
      if(ex&&ey) return 0;
      if(ex) return 1; if(ey) return -1;
      return numeric ? (Number(vx)-Number(vy))*dir : String(vx).localeCompare(String(vy),'ko')*dir;
    });
  }
  return a;
}
/* ══ 보기 — 표에 보일 열 고르기 ════════════════════════════
 *   고른 것은 이 브라우저에 담아 둬서 다음에 열 때도 그대로입니다.
 */
const VIS_KEY='kt_cost_cols';
let _hide={};
try{ const s=localStorage.getItem(VIS_KEY); if(s) _hide=JSON.parse(s)||{}; }catch(e){ _hide={}; }
function visCols(){ const v=COLS.filter(c=>!_hide[c.k]); return v.length?v:COLS.slice(); }
function saveVis(){ try{ localStorage.setItem(VIS_KEY, JSON.stringify(_hide)); }catch(e){} }
function openViewPanel(){
  const old=$('vPop'); if(old) old.remove();
  const box=document.createElement('div'); box.id='vPop';
  box.style.cssText='position:fixed;inset:0;z-index:10000;background:#0008;display:flex;align-items:center;justify-content:center';
  box.innerHTML='<div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;width:300px;max-width:92vw;'
    +'max-height:86vh;overflow:auto;box-shadow:0 16px 44px #000a;font-size:12px;color:var(--text)">'
    +'<div style="padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px">보기 — 표에 보일 열</div>'
    +'<div style="padding:10px 14px">'
    + COLS.map(c=>'<label style="display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer">'
        +'<input type="checkbox" class="vcol" data-k="'+c.k+'" '+(_hide[c.k]?'':'checked')+' style="cursor:pointer;flex:none">'
        +'<span>'+esc(c.t)+'</span></label>').join('')
    +'<div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">끈 열은 화면에서만 숨습니다 — 엑셀 내려받기와 웹에 보내는 공급가에는 그대로 들어갑니다.</div>'
    +'</div>'
    +'<div style="display:flex;gap:7px;padding:11px 14px;border-top:1px solid var(--border)">'
    +'<button id="vAll" style="flex:none;padding:7px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer;font-size:12px">전체 선택</button>'
    +'<button id="vClose" style="flex:1;padding:7px;border:none;border-radius:7px;background:var(--accent2);color:#fff;cursor:pointer;font-size:12px;font-weight:700">닫기</button>'
    +'</div></div>';
  document.body.appendChild(box);
  const commit=()=>{
    box.querySelectorAll('.vcol').forEach(c=>{ const k=c.getAttribute('data-k');
      if(c.checked) delete _hide[k]; else _hide[k]=true; });
    saveVis(); box.remove(); render();
  };
  box.querySelector('#vAll').onclick=()=>box.querySelectorAll('.vcol').forEach(c=>c.checked=true);
  box.querySelector('#vClose').onclick=commit;
  box.onmousedown=e=>{ if(e.target===box) commit(); };
}

// 머리글이 위 도구막대에 가리지 않도록, 도구막대 높이만큼 내려 붙인다
function fixHeadTop(){
  const h=document.querySelector('header');
  if(h) document.documentElement.style.setProperty('--hh', h.offsetHeight+'px');
}
addEventListener('resize', fixHeadTop);

function render(){
  view = filtered();
  const cols=visCols();
  $('th').innerHTML = '<tr>'+cols.map(c=>'<th style="width:'+c.w+'px">'+c.t+fChip(c.k)+'</th>').join('')+'</tr>';
  $('th').querySelectorAll('.fchip').forEach(s=>{ s.onclick=e=>{ e.stopPropagation(); openFilter(s.getAttribute('data-k'), s); }; });
  { const n=Object.keys(_fSel).length + (_fSort.k?1:0);
    const b=$('fclrAll'); if(b){ b.style.display=n?'':'none'; b.textContent='거르개 해제'+(n>1?(' '+n):''); } }
  const rub=num(D.rub), usd=num(D.usd);
  $('tb').innerHTML = view.map((r,i)=>{
    const c=num(r.cost), sk=supKrw(r), sr=supRub(r), g=gpOf(r);
    const cRub = (c!=null&&rub)?fmt(c/rub,1):'';
    const cUsd = (c!=null&&usd)?fmt(c/usd,2):'';
    const manSup = (r.sup!=null && r.sup!=='') ? ' man' : '';
    const pn=hPnOf(r);
    const flag = r.gone    ? '<span class="flag g">없어짐</span>'
               : r.isNew   ? '<span class="flag n">새</span>'
               : r.costNew ? '<span class="flag u">갱신</span>' : '';
    const td={
      nm:  '<td>'+esc(r.nm)+flag+'</td>',
      sp:  '<td style="color:var(--muted)">'+esc(r.sp)+'</td>',
      rep: '<td class="code">'+esc(r.rep)+'</td>',
      cmp: '<td class="code">'+esc(r.cmp)+'</td>',
      fin: '<td class="code">'+esc(r.fin)+'</td>',
      cost:'<td class="num hc'+((r.cost!=null&&r.cost!=='')?' man':'')+'">'+hDot('cost',pn)+'<input class="cell" data-f="cost" value="'+(c!=null?fmt(c,1):'')+'"></td>',
      cRub:'<td class="num" style="color:var(--muted)">'+cRub+'</td>',
      cUsd:'<td class="num" style="color:var(--muted)">'+cUsd+'</td>',
      sup: '<td class="num hc'+manSup+'">'+hDot('sup',pn)+'<input class="cell" data-f="sup" value="'+(r.sup!=null&&r.sup!==''?fmt(num(r.sup),1):'')+'" placeholder="'+(sk!=null?fmt(sk,0):'')+'"></td>',
      sRub:'<td class="num" style="font-weight:700;color:var(--accent2)">'+(sr!=null?fmt(sr,1):'')+'</td>',
      gp:  '<td class="num" style="color:var(--muted)">'+(g!=null?(Math.round(g*1000)/10)+'%':'')+'</td>'
    };
    return '<tr data-i="'+i+'" class="'+(r.gone?'gone':(r.isNew?'isnew':''))+'">'
      + cols.map(cc=>td[cc.k]||'<td></td>').join('') + '</tr>';
  }).join('');
  // 이력 표시를 누르면 그 칸의 변경이력 쪽지가 뜬다
  $('tb').querySelectorAll('.hdot').forEach(s=>{ s.onclick=e=>{ e.stopPropagation();
    hShow(s.getAttribute('data-f'), s.getAttribute('data-pn'), s); }; });
  { const n=hCount(); const b=$('hbtn');
    if(b){ b.textContent='변경이력'+(n?(' '+n):''); b.style.opacity=n?'1':'0.55'; } }
  $('empty').style.display = view.length?'none':'block';
  const withSup = D.rows.filter(r=>supRub(r)!=null).length;
  const nNew = D.rows.filter(r=>r.isNew).length, nGone = D.rows.filter(r=>r.gone).length;
  const nUp = D.rows.filter(r=>r.costNew).length;
  const nOff = COLS.length-cols.length;
  $('cnt').textContent = '품목 '+D.rows.length.toLocaleString()+'개 · 공급가 있는 것 '+withSup.toLocaleString()+'개'
    + (nUp?('  · 원가 갱신 '+nUp.toLocaleString()+'개'):'')
    + (nNew?('  · 새 품번 '+nNew.toLocaleString()+'개'):'')
    + (nGone?('  · 품번조회에 없음 '+nGone.toLocaleString()+'개'):'')
    + (nOff?('  · 숨긴 열 '+nOff+'개'):'')
    + (view.length!==D.rows.length ? ('  (찾은 것 '+view.length.toLocaleString()+'개)') : '');
  fixHeadTop();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* 칸 고치기 */
$('tb').addEventListener('change', e=>{
  const inp=e.target.closest('input.cell'); if(!inp) return;
  const tr=inp.closest('tr'); const r=view[+tr.getAttribute('data-i')];
  const f=inp.getAttribute('data-f');
  const v=inp.value.trim();
  const before=r[f];
  r[f] = (v==='') ? null : num(v);
  hAdd(f, hPnOf(r), before, r[f], '손으로');      // 변경이력에 남긴다
  save(true); render();
});

/* ══ 웹과 맞추기 ══════════════════════════════════════════
 *   품명·규격·대표품번·최종품번의 주인은 웹의 품번조회다.
 *   바탕 자료(PN_BASE) 위에 kt_pn_overrides 를 얹고, 호환품번별 품명·규격은
 *   kt_pn_specs 에서 가져온다 — 웹 화면이 쓰는 규칙 그대로다.
 *   원가·공급가는 호환품번으로 짝을 맞춰 그대로 둔다. 건드리지 않는다.
 */
async function catalogBuild(onStep){
  const sb=sbc();
  // 1) 바탕 + 고친 것
  const pn=(PN_BASE||[]).map(p=>({ rep:p.rep, compats:(p.compats||[]).slice(),
                                   final:p.final||'', name_ko:p.name_ko||'', spec:p.spec||'' }));
  const byRep=new Map(pn.map(p=>[p.rep,p]));
  if(onStep) onStep('품번조회 고친 내용을 읽는 중…');
  for(let from=0;;from+=1000){
    const { data, error }=await sb.from('kt_pn_overrides')
      .select('rep,name_ko,spec,final,compats').order('rep').range(from, from+999);
    if(error) throw new Error('kt_pn_overrides — '+(error.message||error.code));
    (data||[]).forEach(r=>{
      if(r.final===PN_TOMBSTONE){            // 품번조회에서 지운 품목
        const i=pn.findIndex(p=>p.rep===r.rep);
        if(i>=0){ pn.splice(i,1); byRep.delete(r.rep); }
        return;
      }
      let cp=r.compats;
      if(typeof cp==='string'){ try{ cp=JSON.parse(cp); }catch(e){ cp=[]; } }
      const cur=byRep.get(r.rep);
      if(cur){
        if(r.name_ko) cur.name_ko=r.name_ko;
        if(r.spec)    cur.spec=r.spec;
        if(r.final)   cur.final=r.final;
        if(Array.isArray(cp) && cp.length) cur.compats=cp.slice();
      }else{
        const nw={ rep:r.rep, compats:Array.isArray(cp)?cp.slice():[], final:r.final||'',
                   name_ko:r.name_ko||'', spec:r.spec||'' };
        pn.push(nw); byRep.set(r.rep, nw);
      }
    });
    if(!data || data.length<1000) break;
  }
  // 2) 호환품번별 품명·규격 (12만 행짜리 표라 쓰는 품번만 200개씩 끊어 묻는다)
  const want=new Set();
  pn.forEach(p=>{ (p.compats||[]).forEach(c=>{ const k=norm(c); if(k) want.add(k); });
                  const f=norm(p.final); if(f) want.add(f); });
  const list=[...want], specs=new Map();
  const chunks=[]; for(let i=0;i<list.length;i+=200) chunks.push(list.slice(i,i+200));
  for(let i=0;i<chunks.length;i+=8){                       // 한 번에 8묶음씩
    const part=chunks.slice(i,i+8);
    const got=await Promise.all(part.map(async c=>{
      const r=await sb.from('kt_pn_specs').select('pn,name,spec,dan').in('pn', c);
      return r.error?[]:(r.data||[]);
    }));
    got.forEach(rows=>rows.forEach(r=>{ const k=norm(r.pn); if(!k) return;
      specs.set(k,{ name:r.name||'', spec:r.spec||'', dan:r.dan||'' }); }));
    if(onStep) onStep('품명·규격을 읽는 중… '+Math.min(i+8,chunks.length)+'/'+chunks.length);
  }
  // 3) 호환품번 한 개가 한 줄
  const cat=new Map();
  pn.forEach(p=>{
    const finSp=specs.get(norm(p.final))||null;
    (p.compats||[]).forEach(c=>{
      const k=norm(c); if(!k) return;
      const own=specs.get(k)||null;
      // 그 품번에 제 이름이 있으면 그것, 없으면 최종품번 것, 그것도 없으면 대표품번 것
      const sp=(own && (own.name || own.spec)) ? own : (finSp || own || {});
      cat.set(k, { rep:p.rep, fin:p.final||'', cmp:String(c),
                   nm:(sp.name && String(sp.name).trim()) ? String(sp.name) : (p.name_ko||''),
                   sp:(sp.spec && String(sp.spec).trim()) ? String(sp.spec) : (p.spec||''),
                   dan:(own&&own.dan)||'' });
    });
  });
  return cat;
}
let _syncing=false;
async function catalogSync(auto){
  if(_syncing) return;
  _syncing=true;
  const btn=$('sync'); const t0=btn.textContent; btn.disabled=true; btn.textContent='맞추는 중…';
  try{
    const cat=await catalogBuild(s=>msg(s,'busy'));
    let fixed=0, added=0, gone=0;
    const seen=new Set();
    D.rows.forEach(r=>{
      const k=norm(r.cmp||r.rep);
      const c=cat.get(k);
      if(!c){ if(!r.gone){ r.gone=1; gone++; } return; }
      if(r.gone){ delete r.gone; }
      seen.add(k);
      let ch=false;
      if((r.nm||'')!==c.nm){ r.nm=c.nm; ch=true; }
      if((r.sp||'')!==c.sp){ r.sp=c.sp; ch=true; }
      if((r.rep||'')!==c.rep){ r.rep=c.rep; ch=true; }
      if((r.fin||'')!==c.fin){ r.fin=c.fin; ch=true; }
      if(ch) fixed++;
    });
    let n=0; D.rows.forEach(r=>{ const x=Number(r.n); if(isFinite(x)&&x>n) n=x; });
    cat.forEach((c,k)=>{
      if(seen.has(k)) return;
      D.rows.push({ n:++n, nm:c.nm, sp:c.sp, rep:c.rep, cmp:c.cmp, fin:c.fin,
                    cost:null, sup:null, isNew:1 });
      added++;
    });
    D.catAt=new Date().toISOString();
    save(true); fill(); render();
    const parts=[];
    if(fixed) parts.push('품명·규격 '+fixed.toLocaleString()+'개를 고쳤습니다');
    if(added) parts.push('새 품번 '+added.toLocaleString()+'개를 넣었습니다');
    if(gone)  parts.push('품번조회에 없는 것 '+gone.toLocaleString()+'개를 표시했습니다');
    msg(parts.length?('웹과 맞췄습니다 — '+parts.join(' · ')):'웹과 같습니다 — 고칠 것이 없었습니다', 'ok');
  }catch(e){
    msg((auto?'웹과 맞추지 못했습니다 — ':'맞추기 실패 — ')+e.message, 'no');
  }finally{ _syncing=false; btn.disabled=false; btn.textContent=t0; }
}

/* ══ 원가 엑셀 올리기 ══════════════════════════════════════
 *   같은 품번은 올린 엑셀의 원가로 갈아 끼우고, 엑셀에 없는 품번은 그대로 둡니다.
 *   바뀌는 것은 그 품번의 '원가' 하나뿐입니다 — 공급가·품명·규격·품번은 손대지 않습니다.
 *   창 아무 데나 엑셀을 끌어다 놓아도 됩니다.
 */
// 엑셀에서 품번 열과 원가 열이 어디인지 가려낸다.
function xlFindCols(aoa){
  const nz=s=>String(s==null?'':s).replace(/\s+/g,'').toLowerCase();
  const isPn  =s=>/품번|품목코드|부품코드|코드|артикул|код|partno|part_no|itemcode/.test(s);
  const isCost=s=>/원가|매입|구매단가|cost|себестоим/.test(s) && !/공급|판매|판가|price/.test(s);
  for(let r=0;r<Math.min(14,aoa.length);r++){
    const row=aoa[r]||[];
    let pn=-1, cost=-1;
    for(let c=0;c<row.length;c++){
      const s=nz(row[c]); if(!s) continue;
      if(pn<0   && isPn(s))   pn=c;
      if(cost<0 && isCost(s)) cost=c;
    }
    if(pn>=0 && cost>=0) return { head:r, pn, cost, how:'머리글' };
  }
  // 머리글을 못 찾으면: 품번처럼 생긴 칸이 가장 많은 열을 품번으로,
  //   그 오른쪽에서 숫자가 가장 많은 열을 원가로 본다.
  const looksPn=v=>/^[A-Za-z]{0,3}[0-9][0-9A-Za-z-]{5,}$/.test(String(v==null?'':v).trim());
  const w=Math.max(0, ...aoa.map(r=>(r||[]).length));
  let best=-1, bestN=0;
  for(let c=0;c<w;c++){ let n=0; aoa.forEach(r=>{ if(looksPn((r||[])[c])) n++; }); if(n>bestN){ bestN=n; best=c; } }
  if(best<0 || bestN<3) return null;
  let cc=-1, ccN=0;
  for(let c=best+1;c<w;c++){ let n=0;
    aoa.forEach(r=>{ const v=(r||[])[c]; if(v==null||v==='') return; if(num(v)!=null) n++; });
    if(n>ccN){ ccN=n; cc=c; } }
  if(cc<0) return null;
  return { head:-1, pn:best, cost:cc, how:'품번 모양' };
}
// 엑셀 어딘가에 적어 둔 '기준 GP' 를 찾는다(라벨 오른쪽의 첫 숫자). 없으면 null.
function xlFindGp(aoa){
  const nz=s=>String(s==null?'':s).replace(/\s+/g,'').toLowerCase();
  for(let r=0;r<Math.min(24, aoa.length);r++){
    const row=aoa[r]||[];
    for(let c=0;c<row.length;c++){
      if(!/기준gp|gp\(%\)|базовыйgp|basegp/.test(nz(row[c]))) continue;
      for(let d=c+1; d<Math.min(row.length, c+6); d++){
        const v=num(String(row[d]).replace(/%/g,''));
        if(v==null) continue;
        if(v>0 && v<1)    return v;                      // 0.4 로 적힌 경우
        if(v>=1 && v<100) return Math.round(v*10)/1000;  // 40 으로 적힌 경우
      }
    }
  }
  return null;
}
async function costXlApply(aoa, fname){
  const C=xlFindCols(aoa);
  if(!C){
    msg('엑셀에서 품번·원가 열을 찾지 못했습니다','no');
    alert('품번과 원가가 어느 열인지 알아보지 못했습니다.\n\n머리글에 "품번" 과 "원가" 가 적혀 있으면 가장 잘 읽습니다.');
    return;
  }
  const start=(C.head>=0)?C.head+1:0;
  const up=new Map();                       // 품번 → 원가 (같은 품번이 여럿이면 뒤엣것)
  let badNum=0;
  for(let i=start;i<aoa.length;i++){
    const row=aoa[i]||[];
    const pn=norm(row[C.pn]); if(!pn) continue;
    const v=num(row[C.cost]);
    if(v==null){ badNum++; continue; }
    up.set(pn, v);
  }
  if(!up.size){ msg('엑셀에서 읽을 원가가 없었습니다','no'); alert('품번과 원가를 한 줄도 읽지 못했습니다.'); return; }
  // 짝 맞추기 — 한 줄은 호환품번 하나다. 그 품번이 엑셀에 있을 때만 그 줄의 원가를 고친다.
  //   최종품번·대표품번으로 끌어다 맞추지 않는다 — 그러면 엑셀에 없는 다른 품번의
  //   원가까지 건드리게 된다. 못 찾은 품번은 그냥 넘어간다.
  const byPn=new Map();
  D.rows.forEach((r,i)=>{
    const k=norm(r.cmp) || norm(r.fin) || norm(r.rep);   // 그 줄의 품번
    if(!k) return;
    if(!byPn.has(k)) byPn.set(k, []);
    byPn.get(k).push(i);
  });
  const hit=[], miss=[];
  up.forEach((v,pn)=>{
    const list=byPn.get(pn);
    if(!list){ miss.push(pn); return; }
    list.forEach(i=>hit.push({ i, v }));
  });
  // 엑셀에 기준 GP 가 적혀 있으면 그것을 따른다
  const xlGp=xlFindGp(aoa);
  const gpUse=(xlGp!=null)?xlGp:num(D.gp);
  const gpTxt=(gpUse==null)?'-':((Math.round(gpUse*1000)/10)+'%');
  const chg=hit.filter(h=>num(D.rows[h.i].cost)!==h.v).length;
  const same=hit.length-chg;
  // 공급가 KRW 가 비어 있는 줄은 '원가 ÷ (1-GP)' 로 공급가가 셈해진다.
  //   공급가가 적혀 있는 줄은 원가가 들어와도 그 공급가를 그대로 둔다.
  const calcN=hit.filter(h=>{ const r=D.rows[h.i];
    return num(r.sup)==null && num(r.cost)!==h.v; }).length;
  const keepN=hit.filter(h=>{ const r=D.rows[h.i];
    return num(r.sup)!=null && num(r.cost)!==h.v; }).length;
  const ok=confirm('올린 엑셀: '+(fname||'')+'\n'
    + '읽은 품번 '+up.size.toLocaleString()+'개 ('+C.how+'으로 열을 찾음)\n'
    + (xlGp!=null ? ('엑셀에 적힌 기준 GP : '+gpTxt+' → 이 값으로 바꿉니다\n') : ('기준 GP : '+gpTxt+' (지금 값 그대로)\n'))
    + '\n· 원가가 바뀌는 품목 : '+chg.toLocaleString()+'개\n'
    + '· 값이 같아 그대로  : '+same.toLocaleString()+'개\n'
    + '· 여기에 없는 품번  : '+miss.length.toLocaleString()+'개 (그냥 넘어갑니다)\n'
    + (calcN ? ('\n· 그중 공급가가 비어 있는 '+calcN.toLocaleString()+'개는\n'
        + '  공급가를 기준 GP '+gpTxt+' 로 셈합니다\n') : '')
    + (keepN ? ('· 공급가가 적혀 있는 '+keepN.toLocaleString()+'개는\n'
        + '  그 공급가를 그대로 둡니다 (원가만 바뀝니다)\n') : '')
    + '\n엑셀에 없는 품목은 지금 원가를 그대로 둡니다.\n계속할까요?');
  if(!ok) return;
  if(xlGp!=null && num(D.gp)!==xlGp){ hAdd('@gp','', (num(D.gp)!=null?Math.round(num(D.gp)*1000)/10:''), Math.round(xlGp*1000)/10, '엑셀'); D.gp=xlGp; }
  D.rows.forEach(r=>{ if(r.costNew) delete r.costNew; });     // 지난번 표시는 지운다
  // 바꾸는 것은 원가 하나뿐이다. 적어 둔 공급가 KRW 는 그대로 둔다
  //   (공급가가 비어 있는 줄만 '원가 ÷ (1-GP)' 로 저절로 셈해진다 — supKrw 참고).
  hit.forEach(h=>{ const r=D.rows[h.i];
    if(num(r.cost)===h.v) return;
    const b0=r.cost;
    r.cost=h.v; r.costNew=1;
    hAdd('cost', hPnOf(r), b0, r.cost, '엑셀');
  });
  D.costAt=new Date().toISOString();
  save(true); fill(); render();
  msg('원가를 갱신했습니다 — 바뀐 품목 '+chg.toLocaleString()+'개'
      + (miss.length?(' · 여기에 없는 품번 '+miss.length.toLocaleString()+'개'):''), 'ok');
  if(miss.length){
    alert('이 파일에 없는 품번 '+miss.length+'개는 넘어갔습니다.\n\n'
      + miss.slice(0,15).join('\n') + (miss.length>15?('\n… 그 밖 '+(miss.length-15)+'개'):'')
      + '\n\n품번조회에 있는 품번이면 [웹과 맞추기] 를 눌러 품목을 받아온 뒤 다시 올려 보세요.');
  }
}

$('push').onclick=async()=>{
  const map={};
  D.rows.forEach(r=>{
    const v=supRub(r); if(v==null) return;
    const pn=norm(r.cmp||r.rep);
    if(!pn) return;
    if(map[pn]==null || v>map[pn]) map[pn]=v;   /* 같은 품번이 여럿이면 큰 값 */
  });
  const pns=Object.keys(map);
  if(!pns.length){ alert('보낼 공급가가 없습니다.'); return; }
  const where = HOST_URL ? '클라우드와 kituramiparts.com' : '웹';
  if(!confirm(where+'에 공급가(RUB)를 보냅니다.\n\n· 품번 '+pns.length.toLocaleString()+'개\n'
    +'· 원가·GP·환율은 보내지 않습니다\n\n웹의 값은 이 내용으로 바뀝니다. 계속할까요?')) return;
  const btn=$('push'); btn.disabled=true; const t0=btn.textContent; btn.textContent='보내는 중…';
  const now=new Date().toISOString();
  const done=[], failed=[];
  /* 1) 클라우드 */
  try{
    const { error }=await sbc().from('kt_psi_cfg').upsert(
      { id:SUP_CFG_ID, cfg:{ sup:map, at:now }, updated_at:now }, { onConflict:'id' });
    if(error) throw new Error(error.message||error.code);
    done.push('클라우드');
  }catch(e){ failed.push('클라우드 — '+e.message); }
  /* 2) 자체 서버 (api/supply.php) */
  if(HOST_URL){
    try{
      const r=await fetch(HOST_URL, { method:'POST', headers:{'Content-Type':'application/json'},
                                      body:JSON.stringify({ key:HOST_KEY, sup:map }) });
      const j=await r.json().catch(()=>({}));
      if(!r.ok || j.error) throw new Error(j.error || ('HTTP '+r.status));
      done.push('kituramiparts.com');
    }catch(e){ failed.push('kituramiparts.com — '+e.message); }
  }
  if(done.length){ D.pushedAt=now; save(true); fill(); }
  const head='품번 '+pns.length.toLocaleString()+'개 — ';
  if(!failed.length) msg(head+done.join(' · ')+'에 보냈습니다 ('+new Date().toLocaleTimeString()+')','ok');
  else{
    msg(head+(done.length?(done.join(' · ')+'은 됐고, '):'')+'못 보낸 곳: '+failed.join(' / '),'no');
    alert('보내지 못한 곳이 있습니다.\n\n'+failed.join('\n'));
  }
  btn.disabled=false; btn.textContent=t0;
};

function fill(){
  $('rub').value=D.rub==null?'':D.rub;
  $('usd').value=D.usd==null?'':D.usd;
  // 기준 GP 는 퍼센트로 보여 준다(0.4 가 아니라 40)
  $('gp').value = (D.gp==null||D.gp==='') ? '' : (Math.round(Number(D.gp)*1000)/10);
  const bits=['자료 '+(D.made||'')+' 기준'];
  if(D.catAt)   bits.push('품목 맞춤 '+new Date(D.catAt).toLocaleString());
  if(D.costAt)  bits.push('원가 갱신 '+new Date(D.costAt).toLocaleString());
  if(D.pushedAt)bits.push('마지막 보냄 '+new Date(D.pushedAt).toLocaleString());
  $('made').textContent='('+bits.join(' · ')+')';
}
load(); fill(); render();
/* 달이 바뀌었으면 환율을 한 번 받아 온다(지금 웹과 같은 방식) */
if(D.month !== (new Date()).toISOString().slice(0,7)) getFx(true);
/* 열 때마다 웹의 품번조회와 한 번 맞춘다 */
setTimeout(()=>catalogSync(true), 400);
</script>
</body>
